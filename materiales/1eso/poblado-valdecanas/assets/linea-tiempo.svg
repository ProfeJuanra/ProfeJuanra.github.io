<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="system-ui, sans-serif">
  <title>Línea del tiempo de la Edad de los Metales en la Península Ibérica</title>
  <desc>De 5500 a. C. al cambio de era. Fechas aproximadas en años antes de Cristo calibrados; varían según la región.</desc>
  <rect width="720" height="250" fill="#fbf8f1"/>
  <!-- escala: x = 40 + (5500 - año) * 0.12 -->
  <g font-size="12" fill="#444" text-anchor="middle">
    <line x1="40" y1="150" x2="700" y2="150" stroke="#444"/>
    <line x1="40" y1="146" x2="40" y2="154" stroke="#444"/><text x="40" y="170">5500</text>
    <line x1="136" y1="146" x2="136" y2="154" stroke="#444"/><text x="136" y="170">4700</text>
    <line x1="316" y1="146" x2="316" y2="154" stroke="#444"/><text x="316" y="170">3200</text>
    <line x1="436" y1="146" x2="436" y2="154" stroke="#444"/><text x="436" y="170">2200</text>
    <line x1="598" y1="146" x2="598" y2="154" stroke="#444"/><text x="598" y="170">850</text>
    <line x1="700" y1="146" x2="700" y2="154" stroke="#444"/><text x="700" y="170">0</text>
    <text x="370" y="190" fill="#666">años antes de Cristo (aproximados)</text>
  </g>
  <rect x="40" y="110" width="276" height="34" fill="#c9d3b0"/><text x="178" y="132" font-size="14" text-anchor="middle">Neolítico</text>
  <rect x="316" y="110" width="120" height="34" fill="#d98a4e"/><text x="376" y="132" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">Calcolítico</text>
  <rect x="436" y="110" width="162" height="34" fill="#b58b3a"/><text x="517" y="132" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">Edad del Bronce</text>
  <rect x="598" y="110" width="102" height="34" fill="#6d6a66"/><text x="649" y="132" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">Edad del Hierro</text>
  <!-- Edad de los Metales -->
  <path d="M316 100 V92 H700 V100" fill="none" stroke="#444"/><text x="508" y="86" font-size="13" text-anchor="middle">Edad de los Metales</text>
  <!-- Campaniforme -->
  <rect x="400" y="144" width="36" height="5" fill="#7a3c18"/><text x="418" y="210" font-size="11" text-anchor="middle" fill="#7a3c18">campaniforme</text>
  <line x1="418" y1="196" x2="418" y2="152" stroke="#7a3c18" stroke-dasharray="2 2"/>
  <!-- Valdecañas: finales del IV milenio - primera mitad del III milenio a. C. (~3300-2500) -->
  <rect x="304" y="44" width="96" height="22" rx="4" fill="#cc79a7"/>
  <text x="352" y="59" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">Valdecañas</text>
  <line x1="304" y1="70" x2="304" y2="110" stroke="#a24e80" stroke-dasharray="3 3"/><line x1="400" y1="70" x2="400" y2="110" stroke="#a24e80" stroke-dasharray="3 3"/>
  <text x="352" y="32" font-size="11" text-anchor="middle" fill="#7a2f5c">fin del IV milenio – 1.ª mitad del III milenio a. C.</text>
  <text x="40" y="240" font-size="11" fill="#666">Sin dataciones por radiocarbono en Valdecañas: fecha por comparación de materiales.</text>
</svg>
